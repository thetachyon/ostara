# fly.toml app configuration file generated for ostara on 2026-11-02T22:42:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ostara'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

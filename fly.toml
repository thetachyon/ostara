# OSTARA backend on fly.io.
#
# Replace `ostara-api` with the app name you chose (or run `fly launch`
# and let it fill this in). Then:
#   fly secrets set AIS_API_KEY=... THREATFOX_API_KEY=...
#   fly deploy
#
# Every secret is optional — feeds degrade gracefully without their keys.
# See .env.example / DEPLOY.md for the full inventory.

app = "ostara-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm: the AIS vessel feed holds a live websocket and
  # feed caches stay hot. auto-stop would drop the vessel stream whenever
  # inbound traffic idles.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

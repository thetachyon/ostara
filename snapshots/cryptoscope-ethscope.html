<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scope — Block Explorer</title>
<meta name="description" content="Scope: Etherscan-style block explorer. Data by Blockscout.">
<style>
/* EthScope — Etherscan-like light theme */
:root{
  --blue:#0784c3; --blue-dark:#066a9d; --ink:#1e2a38; --muted:#6b7a8d;
  --line:#e3e9f0; --bg:#f4f7fa; --card:#ffffff;
  --green:#0d9d58; --red:#d23b3b; --amber:#b7791f;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* header */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar-inner{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand-badge{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.brand-accent{color:var(--blue)}
.search{flex:1;max-width:560px;position:relative;display:flex}
.search input{flex:1;height:38px;border:1px solid #c8d3df;border-radius:8px 0 0 8px;padding:0 12px;font-size:13px;outline:none;background:#fbfcfe}
.search input:focus{border-color:var(--blue);background:#fff}
.search button{width:44px;border:1px solid var(--blue);border-left:0;background:var(--blue);color:#fff;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.search button:hover{background:var(--blue-dark)}
.suggest{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;z-index:60}
.suggest a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--ink);font-size:13px}
.suggest a:hover{background:#f0f6fb;text-decoration:none}
.suggest .stype{font-size:10px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:4px;padding:2px 6px;flex-shrink:0}
.suggest .stype.block{background:#5b6b7c}.suggest .stype.token{background:#7c4dc4}.suggest .stype.transaction{background:#0d9d58}
.navlinks{margin-left:auto;display:flex;align-items:center;gap:14px}
.navlinks a{font-weight:600;color:var(--ink)}
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);background:#e6f6ec;border:1px solid #bfe6cd;border-radius:999px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.netpill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* hero */
.hero{background:linear-gradient(135deg,#0b3d5c,#0784c3);border-radius:12px;color:#fff;padding:34px 30px;margin:22px 0}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0 0 18px;opacity:.85}
.hero .search{max-width:640px}
.hero .search input{height:46px;font-size:14px}
.hero .search button{width:56px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.card-head .spacer{flex:1}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.stat .v{font-size:19px;font-weight:700}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted)}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.cols2{grid-template-columns:1fr}.topbar-inner{flex-wrap:wrap;height:auto;padding:10px 16px}.search{order:3;flex-basis:100%;max-width:none}.navlinks{flex-wrap:wrap}.netpill{font-size:11px;padding:3px 8px}}
/* phones: the pill keeps its dot (status) but drops its text so the nav
   row fits on one line instead of wrapping to three */
@media(max-width:560px){#netpill-text{display:none}.netpill{padding:4px 6px;gap:0}}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfe;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#f8fbfe}
.tbl .r{text-align:right}
/* home half-width tables: fixed layout + clipped cells so long hashes and
   contract names can't push columns (e.g. Value) off the card */
.tbl-home{table-layout:fixed}
.tbl-home td{overflow:hidden}
.tbl-wrap{overflow-x:auto}
.addr-cell{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0}
.addr-cell>a.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr-cell .badge,.addr-cell .label-pill{flex-shrink:0}
.cell-clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* detail grid */
.detail{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line);font-size:13px}
.detail:last-child{border-bottom:0}
.detail .dk{padding:11px 16px;color:var(--muted);font-weight:600;background:#fbfcfe}
.detail .dv{padding:11px 16px;word-break:break-all}
@media(max-width:640px){.detail{grid-template-columns:1fr}.detail .dk{padding-bottom:2px}}

/* badges & buttons */
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:#e6f6ec;color:var(--green)}
.badge.fail{background:#fdecec;color:var(--red)}
.badge.info{background:#e8f3fb;color:var(--blue-dark)}
.badge.warn{background:#fdf3e0;color:var(--amber)}
.badge.grey{background:#eef1f5;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.copybtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;vertical-align:middle}
.copybtn:hover{color:var(--blue)}
.loadmore{display:block;width:100%;padding:12px;border:0;background:#f4f8fc;color:var(--blue);font-weight:700;cursor:pointer;font-size:13px}
.loadmore:hover{background:#e8f3fb}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;background:#fbfcfe}
.tab{border:0;background:none;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{color:var(--ink)}

/* misc */
.pagehead{display:flex;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.pagehead h2{margin:0;font-size:20px;word-break:break-all}
pre.hex{background:#0f1c28;color:#c8e6f5;border-radius:8px;padding:14px;font-size:12px;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-all;font-family:var(--mono)}
.utf8box{background:#f4faf4;border:1px solid #cde8cd;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:10px}
.utf8box .k{font-weight:700;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.error-banner{background:#fdecec;border:1px solid #f3c2c2;color:#a02a2a;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:13px}
.spinner{padding:40px;text-align:center;color:var(--muted)}
.gasbar{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden;margin-top:6px}
.gasbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.addr-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.footer{margin-top:34px;border-top:1px solid var(--line);background:#fff}
.footer-inner{display:flex;justify-content:space-between;gap:10px;padding:18px 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.logtopics{display:flex;flex-direction:column;gap:4px}

/* ---- chain switcher / labels ---- */
.chainselect{height:34px;border:1px solid #c8d3df;border-radius:8px;padding:0 8px;font-size:13px;font-weight:600;color:var(--ink);background:#fbfcfe;cursor:pointer}
.chainselect:focus{border-color:var(--blue);outline:none}
.netpill.warn{color:var(--amber);background:#fdf3e0;border-color:#ecd9a8}
.label-pill{display:inline-block;font-size:10.5px;font-weight:700;color:#5b4a8a;background:#efe9f9;border:1px solid #d9c8f5;border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}

/* ---- toolbars / export ---- */
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.btn:disabled{opacity:.55;cursor:wait}

/* ---- gas tracker ---- */
.gascards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.gascard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.gascard .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.gascard .v{font-size:24px;font-weight:700}
.gascard .v small{font-size:13px;font-weight:400;color:var(--muted)}
.gascard .sub{font-size:12px;color:var(--muted);margin-top:4px}
.explainer{background:#f0f6fb;border:1px solid #cfe3f2;border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:18px}

/* ---- charts ---- */
.chart-wrap{padding:16px}
.chart-svg{width:100%;height:auto;display:block}
.chart-tick{font-size:11px;fill:var(--muted)}
.daybtns{display:flex;gap:6px}
.daybtns .btn{padding:5px 11px;font-size:12px}
.daybtns .btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---- contract page ---- */
.fncard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 16px}
.fn-sig{font-size:13px;font-weight:700;margin-bottom:10px;word-break:break-all}
.fncard form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:180px;flex:1}
.field>span{font-weight:600}
.field input[type=text],.field select,.field textarea{border:1px solid #c8d3df;border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--mono);background:#fbfcfe}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--blue);outline:none;background:#fff}
.field textarea{font-family:var(--mono);width:100%;min-height:180px;resize:vertical}
.fn-out{margin-top:10px;font-size:13px}
.fn-out table{width:100%;border-collapse:collapse}
.fn-out td,.fn-out th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px}
.fn-out .mono{word-break:break-all}
pre.source{background:#0f1c28;color:#c8e6f5;border-radius:8px;padding:14px;font-size:12px;overflow:auto;max-height:560px;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);margin:12px 16px}
.notice{background:#fdf3e0;border:1px solid #ecd9a8;border-radius:8px;padding:12px 14px;font-size:13px;margin:12px 16px}
.notice.info{background:#e8f3fb;border-color:#cfe3f2}
.walletbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfe;font-size:13px}

/* ---- NFT ---- */
.nftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.nft-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.nft-card:hover{border-color:var(--blue);text-decoration:none}
.nft-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eef1f5}
.nft-card .nft-id{padding:9px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.nft-card .nft-sub{padding:0 10px 9px;font-size:12px;color:var(--muted)}
.nft-hero{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:20px;padding:16px}
@media(max-width:640px){.nft-hero{grid-template-columns:1fr}}
.nft-hero img{width:100%;border-radius:10px;border:1px solid var(--line);background:#eef1f5}

/* ---- api docs ---- */
.docgroup{margin-bottom:8px}
.docgroup h3{margin:18px 0 8px;font-size:15px}
.docitem{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;background:#fff}
.docitem .dpath{font-family:var(--mono);font-size:13px;font-weight:700;word-break:break-all}
.docitem .ddesc{font-size:13px;color:var(--ink);margin-top:4px}
.docitem .dmeta{font-size:12px;color:var(--muted);margin-top:6px}
.docitem code{background:#f0f3f7;border-radius:4px;padding:1px 5px;font-size:12px}
.method{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;margin-right:8px;vertical-align:middle}
.method.get{background:#e6f6ec;color:var(--green)}
.method.post{background:#fdf3e0;color:var(--amber)}

/* ---- wallet dashboard ---- */
.chain-badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue-dark);background:#e8f3fb;border:1px solid #cfe3f2;border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.wallet-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:16px}
.wallet-hero .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.wallet-hero .v{font-size:24px;font-weight:700}
.wallet-hero .sub{font-size:12px;color:var(--muted);margin-top:4px}
.wchain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:16px}
.wchain{border:1px solid var(--line);border-radius:10px;padding:14px}
.wchain .k{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.wchain .v{font-size:19px;font-weight:700;margin-bottom:4px}
.wchain .sub{font-size:12px;color:var(--muted);margin-top:2px}
.suggest-row{display:flex;align-items:stretch}
.suggest-row>a:first-child{flex:1}
.suggest-row .wallet-link{flex-shrink:0;font-weight:700;color:var(--blue);border-left:1px solid var(--line);padding:9px 12px}
.suggest-row .wallet-link:hover{background:#f0f6fb;text-decoration:none}
.nft-card .nft-id .chain-badge{margin-left:4px}

/* ---- misc ---- */
.sample-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;background:#fdf3e0;color:var(--amber);border:1px solid #ecd9a8;text-transform:none;letter-spacing:0}
.total-row{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-weight:700;background:#fbfcfe}

</style>

</head>

"use strict";
/* *Scope frontend — hash-routed single page app, shared by every app in
   the cryptoscope monorepo (ethscope, sepoliascope, optimismscope,
   gnosisscope, walletscope). Per-app behaviour comes from /config.js
   (window.SCOPE_CONFIG), generated by scripts/sync-common.py — no build
   step, no CDN.
   API: /api/<scope>/* — each app serves exactly one chain (walletscope
   serves the cross-chain wallet endpoints instead). */
const CFG = window.SCOPE_CONFIG || {};
const SCOPE = CFG.scope || "ethscope";
const TITLE = CFG.title || "EthScope";
const API = CFG.apiPrefix || "/api/ethscope";
const WALLET_ONLY = !!CFG.walletOnly;
const WALLET_URL = CFG.walletUrl || "";
const SIBLINGS = Array.isArray(CFG.siblings) ? CFG.siblings : [];
/* URL of the Scope app that serves a chain (walletscope cross-links). */
function scopeUrl(chain) {
  const s = SIBLINGS.find((x) => x.chain === chain);
  return s ? s.url : "";
}
function walletHref(addr) {
  return WALLET_ONLY ? "#/wallet/" + addr : WALLET_URL + "/#/wallet/" + addr;
}

/* ---------------- chain state ---------------- */
/* Single-chain apps fix CHAIN in /config.js — there is no chain switcher
   (the header select now jumps between sibling Scope apps instead).
   walletscope serves all chains for the dashboard; CHAIN there is only
   the default context (labels + ENS resolution run on Ethereum). */
const FALLBACK_CHAINS = [
  { id: "ethereum", label: "Ethereum", native: "ETH" },
  { id: "sepolia", label: "Sepolia", native: "ETH" },
  { id: "optimism", label: "Optimism", native: "ETH" },
  { id: "gnosis", label: "Gnosis", native: "xDAI" },
  { id: "solana", label: "Solana", native: "SOL" },
];
let CHAINS = FALLBACK_CHAINS.slice();
let CHAIN = CFG.chain || "ethereum";
let chainLoadFailed = false;
if (!CHAINS.some((c) => c.id === CHAIN)) CHAIN = "ethereum";
function chainInfo() { return CHAINS.find((c) => c.id === CHAIN) || FALLBACK_CHAINS[0]; }
function chainLabel() { return chainInfo().label; }
function nativeSym() { return chainInfo().native || "ETH"; }
function updateNetpill() {
  const t = document.getElementById("netpill-text");
  const p = document.getElementById("netpill");
  if (!t || !p) return;
  t.textContent = CFG.netpill || chainLabel();
  p.classList.toggle("warn", chainLoadFailed);
  p.title = chainLoadFailed
    ? "Chain list could not be loaded from the server — using the built-in list"
    : "Data: Blockscout v2 API, " + chainLabel();
}
async function loadChains() {
  try {
    const d = await getGlobal("/chains");
    if (d && Array.isArray(d.chains) && d.chains.length) { CHAINS = d.chains; chainLoadFailed = false; }
    else throw new Error("empty chain list");
  } catch (e) {
    CHAINS = FALLBACK_CHAINS.slice();
    chainLoadFailed = true;
  }
  if (!CHAINS.some((c) => c.id === CHAIN)) CHAIN = "ethereum";
  updateNetpill();
}

/* ---------------- labels (mainnet-only, curated) ---------------- */
/* labels.json is curated for Ethereum mainnet only, so badges are shown
   only when the selected chain is ethereum — the same address on another
   chain is a different contract/account. */
let LABELS = null;
async function loadLabels() {
  if (LABELS) return LABELS;
  try {
    const r = await fetch("/labels.json");
    const j = await r.json();
    LABELS = new Map((j.labels || []).map((l) => [String(l.address).toLowerCase(), l.label]));
  } catch (e) { LABELS = new Map(); }
  return LABELS;
}
function labelFor(hash, chain) {
  if (!hash || (chain || CHAIN) !== "ethereum" || !LABELS) return null;
  return LABELS.get(String(hash).toLowerCase()) || null;
}
function labelPill(hash, chain) {
  const lab = labelFor(hash, chain);

/* ---------------- Keccak-256 (Ethereum hash, pure JS) ---------------- */
/* 64-bit lanes as [hi, lo] 32-bit pairs; verified against the backend's

  [0x00000000, 0x00000088], [0x00000000, 0x80008009], [0x00000000, 0x8000000A],
  [0x00000000, 0x8000808B], [0x80000000, 0x0000008B], [0x80000000, 0x00008089],
  [0x80000000, 0x00008003], [0x80000000, 0x00008002], [0x80000000, 0x00000080],
  [0x00000000, 0x0000800A], [0x80000000, 0x8000000A], [0x80000000, 0x80008081],
  [0x80000000, 0x00008080], [0x00000000, 0x80000001], [0x80000000, 0x80008008],

const KECCAK_R = [

function _rol64(hi, lo, n) {

      C[x] = [hi, lo];

    const D = [];

      const r = _rol64(C[(x + 1) % 5][0], C[(x + 1) % 5][1], 1);
      D[x] = [C[(x + 4) % 5][0] ^ r[0], C[(x + 4) % 5][1] ^ r[1]];

      s[x + 5 * y][0] ^= D[x][0];
      s[x + 5 * y][1] ^= D[x][1];

    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++)
      B[y + 5 * ((2 * x + 3 * y) % 5)] = _rol64(s[x + 5 * y][0], s[x + 5 * y][1], KECCAK_R[x][y]);
    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) {
      const i = x + 5 * y;
      s[i][0] = B[i][0] ^ ((~B[(x + 1) % 5 + 5 * y][0]) & B[(x + 2) % 5 + 5 * y][0]);
      s[i][1] = B[i][1] ^ ((~B[(x + 1) % 5 + 5 * y][1]) & B[(x + 2) % 5 + 5 * y][1]);

function keccak256(input) {

  padded[data.length] = 0x01;
  padded[total - 1] |= 0x80;

  for (let off = 0; off < total; off += rate) {
    for (let i = 0; i < rate / 8; i++) {
      const o = off + i * 8;
      const lo = (padded[o] | (padded[o + 1] << 8) | (padded[o + 2] << 16) | (padded[o + 3] << 24)) >>> 0;
      const hi = (padded[o + 4] | (padded[o + 5] << 8) | (padded[o + 6] << 16) | (padded[o + 7] << 24)) >>> 0;

/* ---------------- SVG line chart (hand-rolled, no dependency) ---------------- */
function svgChart(points, opts = {}) {
  const vals = (points || []).map((p) => p.y).filter((v) => Number.isFinite(v));
  if (!points || !points.length || !vals.length) return '<div class="empty">No chart data</div>';
  const W = 760, H = 260, padL = 72, padR = 14, padT = 14, padB = 30;
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  const iw = W - padL - padR, ih = H - padT - padB;
  const X = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const Y = (v) => padT + (1 - (v - min) / (max - min)) * ih;
  const fmt = opts.fmtY || ((v) => Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 }));
  const line = points.map((p, i) => `${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const mid = (min + max) / 2;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="${esc(opts.label || "chart")}">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#e3e9f0"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#e3e9f0"/>
    <line x1="${padL}" y1="${Y(mid).toFixed(1)}" x2="${W - padR}" y2="${Y(mid).toFixed(1)}" stroke="#eef1f5"/>
    <text x="${padL - 8}" y="${padT + 4}" text-anchor="end" class="chart-tick">${esc(fmt(max))}</text>
    <text x="${padL - 8}" y="${Y(mid).toFixed(1) + 4}" text-anchor="end" class="chart-tick">${esc(fmt(mid))}</text>
    <text x="${padL - 8}" y="${H - padB + 4}" text-anchor="end" class="chart-tick">${esc(fmt(min))}</text>
    <polyline points="${line}" fill="none" stroke="#0784c3" stroke-width="2"/>
    ${points.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.5" fill="#0784c3"><title>${esc(p.x)}: ${esc(fmt(p.y))}</title></circle>`).join("")}
    <text x="${padL}" y="${H - 8}" class="chart-tick">${esc(points[0].x)}</text>
    ${points.length > 2 ? `<text x="${W / 2}" y="${H - 8}" text-anchor="middle" class="chart-tick">${esc(points[Math.floor(points.length / 2)].x)}</text>` : ""}
    <text x="${W - padR}" y="${H - 8}" text-anchor="end" class="chart-tick">${esc(points[points.length - 1].x)}</text>
  </svg>`;
}

/* ---------------- links ---------------- */
function linkAddr(a, full) {
  if (!a || !a.hash) return '<span class="muted">—</span>';
  const label = a.label && a.label !== a.hash ? esc(a.label) : esc(full ? a.hash : a.short || shortH(a.hash));
  const title = a.label && a.label !== a.hash ? ` title="${esc(a.hash)}"` : "";
  const tag = a.is_contract ? ' <span class="badge grey" title="Contract">C</span>' : "";
  const pill = labelFor(a.hash) && labelFor(a.hash) !== (a.label && a.label !== a.hash ? a.label : null) ? labelPill(a.hash) : "";
  return `<a class="mono" href="#/address/${a.hash}"${title}>${label}</a>${tag}${pill}`;
}
function linkTx(h, full) {
  if (!h) return '<span class="muted">—</span>';
  return `<a class="mono" href="#/tx/${h}">${esc(full ? h : shortH(h))}</a>`;
}
function linkBlock(n) {
  if (n == null) return '<span class="muted">—</span>';
  return `<a class="mono" href="#/block/${n}">${num(n)}</a>`;

function linkToken(addr, symbol) {

/* ---------------- rows ---------------- */
function txRow(t, lite) {
  const cells = [
    `<td>${linkTx(t.hash)}</td>`,
    `<td>${statusBadge(t.status)}</td>`,
    `<td>${t.block != null ? linkBlock(t.block) : '<span class="muted">pending</span>'}</td>`,
    `<td class="muted" style="white-space:nowrap">${esc(t.age || "")}</td>`,
    `<td>${linkAddr(t.from)}</td>`,
    `<td>${linkAddr(t.to)}</td>`,
  ];
  if (!lite) cells.push(`<td class="r mono">${ethFmt(t.value_eth)}&nbsp;${esc(nativeSym())}</td>`);
  else cells.push(`<td class="r mono">${ethFmt(t.value_eth)}</td>`);
  if (!lite) cells.push(`<td class="r mono">${ethFmt(t.fee_eth, 8)}</td>`);

/* ---------------- pager ---------------- */
function mountPager(tbodySel, btnSel, apiBase, rowFn, emptyMsg) {
  const tbody = $(tbodySel), btn = $(btnSel);
  if (!tbody || !btn) return;
  let npp = null, loading = false, first = true;
  async function load() {
    if (loading) return;
    loading = true;
    btn.textContent = "Loading…";
    try {
      const q = npp ? "?" + new URLSearchParams(npp).toString() : "";
      const d = await get(apiBase + q);
      if (first && !d.items.length) {
        tbody.innerHTML = `<tr><td colspan="9"><div class="empty">${esc(emptyMsg || "No records found")}</div></td></tr>`;
      } else {
        if (first) tbody.innerHTML = "";
        tbody.insertAdjacentHTML("beforeend", d.items.map(rowFn).join(""));
      }
      first = false;
      npp = d.next_page_params;
      btn.style.display = npp ? "" : "none";
      btn.textContent = "Load more";
    } catch (e) {
      btn.textContent = "Retry";
      if (first) tbody.innerHTML = `<tr><td colspan="9"><div class="empty">Error: ${esc(e.message)}</div></td></tr>`;
    }
    loading = false;
  }
  btn.onclick = load;
  load();
}

/* ---------------- CSV export ---------------- */
/* Follows next_page_params up to 25 pages / 5,000 rows, builds the CSV
   client-side with proper quoting, and triggers a download. */
async function exportCsv(btn, apiBase, filename, header, toRow) {
  if (!btn || btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  try {
    const rows = [];
    let npp = null, pages = 0, truncated = false;
    do {
      btn.textContent = `Fetching page ${pages + 1}… (${rows.length} rows)`;
      const q = npp ? "?" + new URLSearchParams(npp).toString() : "";
      const d = await get(apiBase + q);
      for (const it of d.items || []) {
        rows.push(toRow(it));
        if (rows.length >= 5000) { truncated = true; break; }
      }
      npp = d.next_page_params;
      pages++;
      if (truncated) break;
    } while (npp && pages < 25);
    if (pages >= 25 && npp) truncated = true;
    const csv = [header, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = `Exported ${rows.length} rows${truncated ? " (capped at 5,000 rows / 25 pages)" : ""}`;
  } catch (e) {
    btn.textContent = "Export failed: " + e.message;
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 5000);
  }
}

/* ---------------- search ---------------- */
function classify(q) {
  q = String(q || "").trim();
  if (/^0x[0-9a-fA-F]{64}$/.test(q)) return { kind: "tx", v: q };
  if (/^0x[0-9a-fA-F]{40}$/.test(q)) return { kind: "address", v: q };
  if (/^\d+$/.test(q)) return { kind: "block", v: q };
  if (q.length >= 2) return { kind: "query", v: q };
  return null;
}
async function doSearch(q) {
  const c = classify(q);
  if (!c) return;
  if (WALLET_ONLY) {
    // WalletScope searches addresses and ENS names only.
    if (c.kind === "address") { location.hash = "#/wallet/" + c.v; return; }
    if (c.kind === "query") {
      try {
        const d = await get("/search?q=" + encodeURIComponent(c.v));
        const hit = (d.items || []).find((it) => it.type === "address");
        if (hit) { location.hash = "#/wallet/" + hit.hash; return; }
        banner("No address found for “" + c.v + "”");
      } catch (e) { banner(e.message); }
      return;
    }
    banner("WalletScope searches addresses and ENS names only.");
    return;
  }
  if (c.kind === "tx") location.hash = "#/tx/" + c.v;
  else if (c.kind === "address") location.hash = "#/address/" + c.v;
  else if (c.kind === "block") location.hash = "#/block/" + c.v;
  else {
    try {
      const d = await get("/search?q=" + encodeURIComponent(c.v));
      if (d.items && d.items.length) {
        const it = d.items[0];
        if (it.type === "address") location.hash = "#/address/" + it.hash;
        else if (it.type === "token") location.hash = "#/token/" + it.hash;
        else if (it.type === "transaction") location.hash = "#/tx/" + it.hash;
        else if (it.type === "block") location.hash = "#/block/" + (it.block_number || it.hash);
        else banner("No results for “" + c.v + "”");
      } else banner("No results for “" + c.v + "”");
    } catch (e) { banner(e.message); }
  }
}
function wireSearch(form, input, suggestBox) {
  if (!form || !input || !suggestBox) return;
  let timer = null;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    suggestBox.classList.add("hidden");
    doSearch(input.value);
  });
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { suggestBox.classList.add("hidden"); return; }
    timer = setTimeout(async () => {
      try {
        const d = await get("/search?q=" + encodeURIComponent(q));
        const items = WALLET_ONLY ? (d.items || []).filter((it) => it.type === "address") : (d.items || []);
        if (!items.length) { suggestBox.classList.add("hidden"); return; }
        suggestBox.innerHTML = items.map((it) => {
          const route = it.type === "address" ? (WALLET_ONLY ? "#/wallet/" + it.hash : "#/address/" + it.hash)
            : it.type === "token" ? "#/token/" + it.hash
            : it.type === "transaction" ? "#/tx/" + it.hash
            : it.type === "block" ? "#/block/" + (it.block_number || it.hash) : null;
          if (!route) return "";
          const main = `<a href="${route}"><span class="stype ${it.type}">${esc(it.type)}</span><span class="mono">${esc(it.name)}</span></a>`;
          // Address rows get a second link straight to the wallet dashboard.
          return it.type === "address" && !WALLET_ONLY
            ? `<div class="suggest-row">${main}<a class="wallet-link" href="${walletHref(it.hash)}" title="Open wallet dashboard">💼 Wallet</a></div>`
            : main;
        }).join("");
        suggestBox.classList.remove("hidden");
      } catch (e) { /* silent */ }
    }, 300);
  });
  document.addEventListener("click", (e) => {
    if (!form.contains(e.target)) suggestBox.classList.add("hidden");
  });
}

}

/* ---------------- contract page ---------------- */
let walletAccount = null;
function fnMutability(fn) {
  if (fn.stateMutability) return fn.stateMutability;
  if (fn.constant) return "view";
  return fn.payable ? "payable" : "nonpayable";
}
function fnSignature(fn) {
  const ins = (fn.inputs || []).map((i) => i.type).join(", ");
  const outs = (fn.outputs || []).map((o) => o.type).join(", ");
  return `${fn.name}(${ins})${outs ? " → (" + outs + ")" : ""}`;
}
function fnInputFields(fn, prefix) {
  return (fn.inputs || []).map((inp, j) => {
    const isArray = /\[.*\]$/.test(inp.type);
    const ph = inp.type === "bool" ? "true / false" : isArray ? 'JSON array, e.g. ["0x…", "0x…"]' : inp.type;
    return `<label class="field"><span>${esc(inp.name || "arg" + j)} <span class="muted mono">${esc(inp.type)}</span></span><input type="text" name="${prefix}${j}" placeholder="${esc(ph)}"></label>`;
  }).join("");
}
function renderCallOutputs(outEl, outputs, values) {
  if (!outputs || !outputs.length) {
    outEl.innerHTML = '<div class="muted">Call succeeded (no return values).</div>';
    return;
  }
  outEl.innerHTML = `<table><thead><tr><th>Name</th><th>Type</th><th>Value</th></tr></thead><tbody>${outputs.map((o, i) => {
    const v = values[i];
    let cell;
    if (o.type === "address" && typeof v === "string" && /^0x[0-9a-fA-F]{40}$/.test(v)) cell = linkAddr({ hash: v, label: v, short: shortH(v) });
    else if (v !== null && typeof v === "object") cell = `<span class="mono">${esc(JSON.stringify(v))}</span>`;
    else cell = `<span class="mono">${esc(String(v))}</span>`;
    return `<tr><td>${esc(o.name || "")}</td><td class="mono">${esc(o.type)}</td><td>${cell}</td></tr>`;
  }).join("")}</tbody></table>`;
}

async function contractPage(addr) {
  clearPoll();
  render(spinner());
  let c;
  try { c = await get("/contract/" + addr); }
  catch (e) { render(`<div class="pagehead"><h2>Contract</h2></div><div class="card"><div class="empty">Contract not available on ${esc(chainLabel())}<br><span class="mono muted">${esc(addr)}</span><br><span class="muted">${esc(e.message)}</span></div></div>`); return; }
  document.title = `${c.name || shortH(c.address)} — EthScope`;
  const abi = Array.isArray(c.abi) ? c.abi : [];
  const fns = abi.filter((f) => f.type === "function" && f.name);
  const readFns = fns.filter((f) => { const m = fnMutability(f); return m === "view" || m === "pure"; });
  const writeFns = fns.filter((f) => { const m = fnMutability(f); return m === "nonpayable" || m === "payable"; });
  const impls = (c.implementations || []).map((i) =>
    `<a class="mono" href="#/address/${esc(i.address)}">${esc(shortH(i.address))}</a>${i.name ? ` <span class="muted">(${esc(i.name)})</span>` : ""}`).join("<br>");
  render(`
    <div class="pagehead"><h2>Contract</h2> ${c.verified ? '<span class="badge ok">✓ Verified</span>' : '<span class="badge warn">Unverified</span>'}</div>
    <div class="card">
      <div style="padding:14px 16px;border-bottom:1px solid var(--line)">
        <div class="addr-title"><b style="font-size:17px">${esc(c.name || "Unknown contract")}</b>${labelPill(c.address)}</div>
        <div class="mono" style="margin-top:6px"><a href="#/address/${esc(c.address)}">${esc(c.address)}</a> ${copyBtn(c.address)}</div>
      </div>
      ${detailRow("Verified", c.verified ? `<span class="badge ok">Verified</span> <span class="muted">${c.verified_at ? "on " + esc(String(c.verified_at).slice(0, 10)) : ""}</span>` : '<span class="badge warn">Source not verified</span>')}
      ${detailRow("Compiler", `<span class="mono">${esc(c.compiler_version || "—")}</span>`)}
      ${detailRow("Language", esc(c.language || "—"))}
      ${detailRow("EVM Version", `<span class="mono">${esc(c.evm_version || "—")}</span>`)}
      ${detailRow("License", esc(c.license_type || "—"))}
      ${c.optimization_enabled != null ? detailRow("Optimization", esc(String(c.optimization_enabled))) : ""}
      ${c.proxy_type ? detailRow("Proxy", `<span class="mono">${esc(c.proxy_type)}</span>`) : ""}
      ${impls ? detailRow("Implementation", impls) : ""}
      ${c.creation_tx ? detailRow("Creation Txn", linkTx(c.creation_tx)) : ""}
      ${detailRow("Address Page", `<a href="#/address/${esc(c.address)}">View address →</a>`)}
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-ctab="source">Source Code</button>
        <button class="tab" data-ctab="read">Read Contract (${readFns.length})</button>
        <button class="tab" data-ctab="write">Write Contract (${writeFns.length})</button>
        <button class="tab" data-ctab="verify">Verify Contract</button>
      </div>
      <div id="contract-tab-body"></div>
    </div>`);

  const body = $("#contract-tab-body");
  function renderCTab(tab) {
    if (tab === "source") {
      const extra = (c.additional_sources || []).map((s) =>
        `<div style="margin:12px 16px 0"><b>${esc(s.filename || s.name || "additional source")}</b><pre class="source" style="margin:8px 0 0">${esc(s.source_code || s.sourceCode || "")}</pre></div>`).join("");
      body.innerHTML = c.source_code
        ? `<pre class="source">${esc(c.source_code)}</pre>${extra}`
        : '<div class="empty">Source code is not available for this contract (unverified or not published).</div>';
    } else if (tab === "read") {
      if (!readFns.length) { body.innerHTML = '<div class="empty">No view/pure functions in this contract’s ABI.</div>'; return; }
      body.innerHTML = `<div class="muted" style="padding:12px 16px 0;font-size:12.5px">Read-only calls run against the ${esc(chainLabel())} public RPC (<span class="mono">eth_call</span>) — no wallet, no gas.</div>` +
        readFns.map((fn, i) => `<div class="fncard">
          <div class="fn-sig mono">${esc(fnSignature(fn))} <span class="badge info">${esc(fnMutability(fn))}</span></div>
          <form class="read-form" data-i="${i}">${fnInputFields(fn, "arg")}
            <button class="btn primary" type="submit">Query</button>
          </form>
          <div class="fn-out" id="read-out-${i}"></div>
        </div>`).join("");
      body.querySelectorAll(".read-form").forEach((f) => f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fn = readFns[+f.dataset.i];
        const out = $("#read-out-" + f.dataset.i);
        const btn = f.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.textContent = "Querying…";
        try {
          const args = (fn.inputs || []).map((inp, j) => parseArg(inp.type, f.elements["arg" + j].value));
          const res = await postJson(`/contract/${addr}/call`, {
            function: { name: fn.name, inputs: fn.inputs || [], outputs: fn.outputs || [], stateMutability: fnMutability(fn) },
            args,
          });
          renderCallOutputs(out, res.outputs, res.values);
        } catch (err) { out.innerHTML = `<div class="error-banner" style="margin:0">Error: ${esc(err.message)}</div>`; }
        btn.disabled = false;
        btn.textContent = "Query";
      }));
    } else if (tab === "write") {
      if (!writeFns.length) { body.innerHTML = '<div class="empty">No nonpayable/payable functions in this contract’s ABI.</div>'; return; }
      const hasWallet = typeof window.ethereum !== "undefined";
      body.innerHTML = `
        <div class="walletbar">
          ${hasWallet
            ? (walletAccount
              ? `<span>Connected wallet: <span class="mono">${esc(walletAccount)}</span></span><button class="btn" id="wallet-disconnect">Disconnect</button>`
              : `<button class="btn primary" id="wallet-connect">Connect Wallet</button><span class="muted">MetaMask or another injected wallet is required to send transactions.</span>`)
            : `<span class="muted">No injected wallet detected in this browser.</span><button class="btn primary" id="wallet-connect">Connect Wallet</button>`}
          <span class="muted">Make sure your wallet is on ${esc(chainLabel())} before sending — EthScope does not switch networks for you.</span>
        </div>
        ${!hasWallet ? '<div class="notice">Write Contract is read-only here: no <span class="mono">window.ethereum</span> provider was found. Install MetaMask (or another injected wallet) and reload the page to send transactions. Read Contract above still works without a wallet.</div>' : ""}
        ${writeFns.map((fn, i) => `<div class="fncard">
          <div class="fn-sig mono">${esc(fnSignature(fn))} <span class="badge ${fnMutability(fn) === "payable" ? "warn" : "grey"}">${esc(fnMutability(fn))}</span></div>
          <form class="write-form" data-i="${i}">${fnInputFields(fn, "arg")}
            ${fnMutability(fn) === "payable" ? `<label class="field"><span>Value <span class="muted mono">${esc(nativeSym())} (optional)</span></span><input type="text" name="value" placeholder="0.0"></label>` : ""}
            <button class="btn primary" type="submit">Send Transaction</button>
          </form>
          <div class="fn-out" id="write-out-${i}"></div>
        </div>`).join("")}`;
      const connectBtn = $("#wallet-connect");
      if (connectBtn) connectBtn.onclick = async () => {
        if (!window.ethereum) {
          banner("No injected wallet found — install MetaMask (or another wallet that injects window.ethereum) and reload the page.");
          return;
        }
        try {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          walletAccount = accounts && accounts[0];
          if (walletAccount) renderCTab("write");
        } catch (err) { banner("Wallet connection failed: " + (err.message || err)); }
      };
      const discBtn = $("#wallet-disconnect");
      if (discBtn) discBtn.onclick = () => { walletAccount = null; renderCTab("write"); };
      body.querySelectorAll(".write-form").forEach((f) => f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fn = writeFns[+f.dataset.i];
        const out = $("#write-out-" + f.dataset.i);
        const btn = f.querySelector("button[type=submit]");
        if (!window.ethereum) { out.innerHTML = '<div class="error-banner" style="margin:0">No injected wallet found — install MetaMask to send transactions.</div>'; return; }
        if (!walletAccount) { out.innerHTML = '<div class="error-banner" style="margin:0">Connect your wallet first (button above).</div>'; return; }
        btn.disabled = true;
        btn.textContent = "Sending…";
        try {
          const args = (fn.inputs || []).map((inp, j) => parseArg(inp.type, f.elements["arg" + j].value));
          const data = encodeFunctionCall(fn, args);
          const tx = { from: walletAccount, to: addr, data };
          if (fnMutability(fn) === "payable") {
            const v = (f.elements["value"] && f.elements["value"].value || "").trim();
            if (v) tx.value = ethToWeiHex(v);
          }
          const txHash = await window.ethereum.request({ method: "eth_sendTransaction", params: [tx] });
          out.innerHTML = `<div class="utf8box"><div class="k">Transaction sent</div><div>Hash: ${linkTx(txHash, true)} — track it on the transaction page once it is mined.</div></div>`;
        } catch (err) { out.innerHTML = `<div class="error-banner" style="margin:0">Error: ${esc(err.message || String(err))}</div>`; }
        btn.disabled = false;
        btn.textContent = "Send Transaction";
      }));
    } else if (tab === "verify") {
      /* NOTE: the EthScope backend verify route takes JSON (it forwards
         multipart to Blockscout itself), so this form POSTs JSON. The
         upstream result is shown verbatim below — never faked as success. */
      body.innerHTML = `
        <div class="notice info">Submits source code to Blockscout for verification on ${esc(chainLabel())}. The upstream result is shown verbatim — a rejection is reported as a rejection, never as a success.</div>
        <form id="verify-form" style="padding:4px 16px 16px">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <label class="field"><span>Compiler version *</span><input type="text" name="compiler_version" placeholder="v0.8.20+commit.a1b79de6" required></label>
            <label class="field"><span>Contract name *</span><input type="text" name="contract_name" placeholder="MyToken" required></label>
            <label class="field"><span>EVM version</span><input type="text" name="evm_version" placeholder="default"></label>
            <label class="field"><span>License type</span><input type="text" name="license_type" placeholder="none"></label>
          </div>
          <label class="field" style="margin-top:10px"><span>Constructor arguments (hex, optional)</span><input type="text" name="constructor_args" placeholder="0x…"></label>
          <label class="field" style="margin-top:10px"><span>Source code *</span><textarea name="source_code" placeholder="pragma solidity …" required></textarea></label>
          <div style="margin-top:10px"><button class="btn primary" type="submit">Submit for Verification</button></div>
        </form>
        <div id="verify-out" style="padding:0 16px 16px"></div>`;
      $("#verify-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.currentTarget;
        const out = $("#verify-out");
        const btn = f.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.textContent = "Submitting…";
        out.innerHTML = "";
        try {
          const res = await postJson(`/contract/${addr}/verify`, {
            source_code: f.elements["source_code"].value,
            contract_name: f.elements["contract_name"].value,
            compiler_version: f.elements["compiler_version"].value,
            constructor_args: f.elements["constructor_args"].value || "",
            evm_version: f.elements["evm_version"].value || "",
            license_type: f.elements["license_type"].value || "",
          });
          out.innerHTML = `<div class="${res.ok ? "utf8box" : "error-banner"}" style="margin:0 0 10px">${res.ok ? "Upstream reports success." : "Upstream did NOT verify this contract."} ${res.message ? "Message: " + esc(String(res.message)) : ""}</div>
            <pre class="hex" style="max-height:320px">${esc(JSON.stringify(res, null, 2))}</pre>`;
        } catch (err) { out.innerHTML = `<div class="error-banner" style="margin:0">Error: ${esc(err.message)}</div>`; }
        btn.disabled = false;
        btn.textContent = "Submit for Verification";
      });
    }
  }
  document.querySelectorAll("[data-ctab]").forEach((t) => {
    t.onclick = () => {
      document.querySelectorAll("[data-ctab]").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      renderCTab(t.dataset.ctab);
    };
  });
  renderCTab("source");
}

function docsGroup(path) {
  const p = path.replace(/^\/api\/[^/]+/, "");
  if (p === "/chains" || p === "/docs") return "Meta";
  if (p === "/stats" || p === "/gastracker") return "Chain & Gas";
  if (p.startsWith("/block")) return "Blocks";
  if (p.startsWith("/tx")) return "Transactions";
  if (p.startsWith("/address")) return "Addresses";
  if (p.startsWith("/wallet")) return "Wallet";
  if (p.startsWith("/token")) return "Tokens";
  if (p.startsWith("/contract")) return "Contracts";
  if (p.startsWith("/charts")) return "Charts";
  if (p === "/pending") return "Pending";
  if (p === "/search") return "Search";
  return "Other";
}
async function apiDocsPage() {
  clearPoll();
  document.title = `API Docs — ${TITLE}`;
  render(`<div class="pagehead"><h2>API Documentation</h2></div><div id="docs-body"><div class="spinner">Loading…</div></div>`);
  let d;
  try { d = await getGlobal("/docs"); }
  catch (e) { $("#docs-body").innerHTML = `<div class="card"><div class="empty">API docs unavailable: ${esc(e.message)}</div></div>`; return; }
  // Deduplicate legacy vs chain-prefixed entries; show the chain-prefixed path.
  const byKey = new Map();
  for (const e of d.endpoints || []) {
    const suffix = e.path.replace(/^\/api\/[^/]+/, "");
    const key = e.method + " " + suffix;
    if (!byKey.has(key) || e.path.includes("{chain}")) byKey.set(key, e);
  }
  const groups = {};
  for (const e of byKey.values()) {
    const g = docsGroup(e.path);
    (groups[g] = groups[g] || []).push(e);
  }
  const order = ["Chain & Gas", "Blocks", "Transactions", "Addresses", "Wallet", "Tokens", "Contracts", "Charts", "Pending", "Search", "Meta", "Other"];
  const shown = order.filter((g) => groups[g]).concat(Object.keys(groups).filter((g) => !order.includes(g)));
  $("#docs-body").innerHTML = `
    <div class="explainer"><b>Fair use:</b> this API is keyless and needs no auth — it proxies the public Blockscout API, public RPCs, and CoinGecko’s keyless tier, all of which are rate-limited upstream. Please cache responses, keep request rates modest, and expect occasional 502s when an upstream is slow. Nothing here is authenticated or billed.</div>
    ${shown.map((g) => `<div class="docgroup"><h3>${esc(g)}</h3>${groups[g].map((e) => `
      <div class="docitem">
        <span class="method ${e.method.toLowerCase()}">${esc(e.method)}</span><span class="dpath">${esc(e.path)}</span>
        <div class="ddesc">${esc(e.description)}</div>
        <div class="dmeta">${e.params && e.params.length ? `Params: ${e.params.map((p) => `<code>${esc(p)}</code>`).join(", ")}<br>` : ""}Example: <code>${esc(e.example)}</code></div>
      </div>`).join("")}</div>`).join("")}`;
}

/* Self-contained: everything the #/wallet route needs lives in this
   section (plus getWallet/getChain and the chain-aware links above).
   In walletscope this is the whole app; in explorer apps the wallet
   routes redirect to walletscope. Backend:
   GET /api/<scope>/wallet/{address} (+ /tokens, /history, /pnl,
   /nfts, /activity). */

const WALLET_ADDR_RE = /^0x[0-9a-fA-F]{40}$/;
const SOL_ADDR_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const WALLET_CHAINS = ["ethereum", "sepolia", "optimism", "gnosis", "solana"];
let walletRun = 0; // bumped per walletPage() call; stale fetches bail

function pctHtml(p) {
  if (p == null || !Number.isFinite(Number(p))) return '<span class="muted">—</span>';
  const v = Number(p);
  return `<span style="color:${v >= 0 ? "var(--green)" : "var(--red)"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}

async function resolveWalletParam(param) {
  // EVM address or Solana base58 address: use as-is. Anything else is
  // treated as an ENS name and resolved on Ethereum mainnet.
  if (WALLET_ADDR_RE.test(param) || SOL_ADDR_RE.test(param)) return { address: param, ens: null };
  const d = await getChain("ethereum", "/search?q=" + encodeURIComponent(param));
  const hit = (d.items || []).find((it) => it.type === "address");
  if (!hit) throw new Error("No address found for \"" + param + "\" (searched Ethereum mainnet)");
  return { address: hit.hash, ens: hit.name };
}

    <div class="card"><div class="card-head">Activity — EVM Chains</div><div id="w-activity"><div class="spinner">Loading activity…</div></div></div>
    </div>`);

  // Resolve ENS names through the existing ethereum search path.
  let addr, ensName = null;
  try {
    const r = await resolveWalletParam(param);
    addr = r.address; ensName = r.ens;
  } catch (e) {
    if (!alive()) return;
    $("#w-hero").innerHTML = `<div class="empty">Could not resolve “${esc(param)}”: ${esc(e.message)}<br><a href="#/wallet">Try another address</a></div>`;
    for (const id of ["w-chains", "w-holdings", "w-history", "w-pnl", "w-nfts", "w-activity"]) {
      const el = document.getElementById(id); if (el) el.innerHTML = "";
    }
    return;
  }
  document.title = `${ensName || shortH(addr)} — Wallet — ${TITLE}`;
  const addrEl = $("#w-addr");
  // Solana addresses have no EthScope page — link out to Solscan until SolScope exists.
  const addrHref = SOL_ADDR_RE.test(addr)
    ? `https://solscan.io/account/${addr}`
    : ((WALLET_ONLY && scopeUrl("ethereum")) ? scopeUrl("ethereum") + "/#/address/" + addr : "#/address/" + addr);
  if (addrEl) addrEl.innerHTML = `<a class="mono" href="${addrHref}"${SOL_ADDR_RE.test(addr) ? ' target="_blank" rel="noopener"' : ""}>${esc(addr)}</a>${ensName ? ` <span class="badge info">${esc(ensName)}</span>` : ""} ${copyBtn(addr)}`;

  const st = {
    addr, ens: ensName, agg: null,
    tokens: {}, // chain -> section from /tokens?chain=
    tokensDone: 0, showDust: false, sortDesc: true,
    histDays: 30, activityCursors: {}, activityRows: [],
  };

  /* ---- hero + chain cards (recomputed as token sections arrive) ---- */
  function totals() {
    let native = 0, tokens = 0, tokensKnown = false;
    if (st.agg) native = Number(st.agg.total_native_usd) || 0;
    for (const c of WALLET_CHAINS) {
      const sec = st.tokens[c];
      if (sec && sec.tokens_total_usd != null) { tokens += sec.tokens_total_usd; tokensKnown = true; }
    }
    return { native, tokens, tokensKnown, total: native + tokens };
  }
  function combinedChange() {
    // Value-weighted 24h change over native holdings + priced tokens
    // that have a 24h change. Returns {pct, covered} or null.
    let cur = 0, prior = 0;
    if (st.agg && st.agg.change_24h_pct != null && st.agg.change_24h_coverage_usd) {
      const v = st.agg.change_24h_coverage_usd;
      cur += v; prior += v / (1 + st.agg.change_24h_pct / 100);
    }
    for (const c of WALLET_CHAINS) {
      for (const t of (st.tokens[c] || {}).tokens || []) {
        if (t.usd_value != null && t.usd_change_24h_pct != null) {
          cur += t.usd_value; prior += t.usd_value / (1 + t.usd_change_24h_pct / 100);
        }
      }
    }
    if (prior <= 0 || cur <= 0) return null;
    return { pct: (cur - prior) / prior * 100, covered: cur };
  }
  function renderHero() {
    const el = $("#w-hero"); if (!el) return;
    if (!st.agg) { el.innerHTML = `<div class="empty">Wallet aggregate failed to load.</div>`; return; }
    const t = totals();
    const chg = combinedChange();
    const pending = st.tokensDone < WALLET_CHAINS.length;
    const covNote = chg
      ? `24h change covers ${usd(chg.covered)} of ${usd(t.total)} (native + priced tokens with a 24h change)`
      : "No 24h change data available";
    el.innerHTML = `
      <div class="wallet-hero">
        <div><div class="k">Portfolio Total (USD)</div><div class="v">${usd(t.total)}</div><div class="sub">Native ${usd(t.native)}${t.tokensKnown ? ` · Tokens ${usd(t.tokens)}` : " · Tokens loading…"}${pending ? ' <span class="muted">(holdings still loading)</span>' : ""}</div></div>
        <div><div class="k">24h Change</div><div class="v">${chg ? pctHtml(chg.pct) : '<span class="muted">—</span>'}</div><div class="sub">${esc(covNote)}</div></div>
        <div><div class="k">Address</div><div class="v" style="font-size:15px"><span class="mono">${esc(st.ens || shortH(st.addr))}</span></div><div class="sub">${esc(st.agg.testnet_note || "")}</div></div>
      </div>
      ${st.agg.errors && st.agg.errors.length ? `<div class="notice" style="margin:12px 16px">Some chains failed in the aggregate: ${esc(st.agg.errors.join(", "))}. Sections below still load per chain.</div>` : ""}`;
  }
  function renderChains() {
    const el = $("#w-chains"); if (!el) return;
    if (!st.agg) { el.innerHTML = `<div class="empty">Chain breakdown unavailable (aggregate failed).</div>`; return; }
    const t = totals();
    el.innerHTML = `<div class="wchain-grid">${WALLET_CHAINS.map((c) => {
      const sec = (st.agg.chains || {})[c] || {};
      const tok = st.tokens[c];
      const tokUsd = tok && tok.tokens_total_usd != null ? tok.tokens_total_usd : null;
      const chainUsd = (sec.chain_total_usd || 0) + (tokUsd || 0);
      const share = t.total > 0 ? chainUsd / t.total * 100 : 0;
      const sym = chainNativeSym(c);
      return `<div class="wchain">
        <div class="k">${esc(sec.label || c)} ${chainBadge(c)}</div>
        <div class="v">${usd(chainUsd)} <span class="muted" style="font-size:12px">${share.toFixed(1)}%</span></div>
        <div class="sub">Native: <span class="mono">${ethFmt(sec.native_balance)} ${esc(sym)}</span>${sec.native_usd_value != null ? ` (${usd(sec.native_usd_value)})` : " (no market price)"}</div>
        <div class="sub">Tokens: ${tokUsd != null ? usd(tokUsd) : (tok ? "—" : "loading…")}${tok && tok.tokens_count != null ? ` · ${num(tok.tokens_priced_count)} priced of ${num(tok.tokens_count)}` : ""}</div>
        <div class="sub">NFTs: ${tok && tok.nft_count != null ? num(tok.nft_count) : "—"}</div>
        ${sec.error ? `<div class="sub" style="color:var(--red)">Error: ${esc(sec.error)}</div>` : ""}
        ${tok && tok.error ? `<div class="sub" style="color:var(--red)">Holdings error: ${esc(tok.error)}</div>` : ""}
      </div>`;
    }).join("")}</div>`;
  }

  /* ---- holdings (merged across chains, top 50 by value) ---- */
  function renderHoldings() {
    const el = $("#w-holdings"); if (!el) return;
    const all = [];
    let pricedCount = 0, totalCount = 0;
    for (const c of WALLET_CHAINS) {
      const sec = st.tokens[c];
      if (!sec) continue;
      totalCount += sec.tokens_count || 0;
      pricedCount += sec.tokens_priced_count || 0;
      for (const t of sec.tokens || []) all.push({ ...t, chain: c });
    }
    if (st.tokensDone === 0) { el.innerHTML = `<div class="spinner">Loading token holdings…</div>`; return; }
    if (!all.length) { el.innerHTML = `<div class="empty">No priced token holdings on any chain.</div>`; return; }
    all.sort((a, b) => (b.usd_value || 0) - (a.usd_value || 0));
    if (!st.sortDesc) all.reverse();
    const shown = all.filter((t) => st.showDust || t.usd_value == null || t.usd_value >= 1).slice(0, 50);
    const dustHidden = all.filter((t) => t.usd_value != null && t.usd_value < 1).length;
    el.innerHTML = `
      <table class="tbl"><thead><tr><th>Token</th><th>Chain</th><th class="r">Balance</th><th class="r">Price</th><th class="r"><a href="#" id="w-sort-value" style="color:inherit">Value ${st.sortDesc ? "↓" : "↑"}</a></th><th class="r">24h %</th></tr></thead>
      <tbody>${shown.map((t) => `<tr>
        <td>${linkTokenC(t.chain, t.address, t.symbol)} <span class="muted">${esc(t.name || "")}</span></td>
        <td>${chainBadge(t.chain)}</td>
        <td class="r mono">${esc(t.balance)}</td>
        <td class="r mono">${t.usd_price != null ? usd(t.usd_price) : "—"}</td>
        <td class="r mono">${t.usd_value != null ? usd(t.usd_value) : "—"}</td>
        <td class="r mono">${pctHtml(t.usd_change_24h_pct)}</td>
      </tr>`).join("")}</tbody></table>
      <div class="muted" style="padding:10px 16px;font-size:12px">Showing ${shown.length} of ${all.length} priced holdings (top 50 per chain, sorted by value). Only tokens with a USD price are listed — ${num(pricedCount)} of ${num(totalCount)} holdings priced across all chains; the rest have no market price and are excluded.${dustHidden && !st.showDust ? ` ${dustHidden} dust holding(s) under $1 hidden — tick “Show dust” to reveal.` : ""}</div>`;
    const sv = $("#w-sort-value");
    if (sv) sv.onclick = (e) => { e.preventDefault(); st.sortDesc = !st.sortDesc; renderHoldings(); };
  }
  const dustBox = $("#w-dust");
  if (dustBox) dustBox.onchange = () => { st.showDust = dustBox.checked; renderHoldings(); };

  /* ---- history chart (estimate — today's balances x past prices) ---- */
  async function renderHistory() {
    const el = $("#w-history"); if (!el) return;
    el.innerHTML = `<div class="spinner">Loading history…</div>`;
    try {
      const d = await getWallet(`/${addr}/history?days=${st.histDays}`);
      if (!alive()) return;
      const pts = (d.points || []).map((p) => ({ x: p.date, y: p.value_usd }));
      el.innerHTML = `
        <div class="chart-wrap">${svgChart(pts, { label: `Portfolio value, ${st.histDays} days (estimate)`, fmtY: (v) => "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }) })}</div>
        <div class="muted" style="padding:0 16px 14px;font-size:12px">${esc(d.method || "")} ${esc(d.note || "")}<br>
        Priced in: ${(d.included || []).map((t) => `${esc(t.token || "?")} (${esc(t.chain)})`).join(", ") || "native only"} · ${d.excluded_tokens || 0} priced holding(s) excluded from the chart (top 5 only).</div>`;
    } catch (e) {
      if (!alive()) return;
      el.innerHTML = `<div class="empty">History unavailable: ${esc(e.message)}</div>`;
    }
  }
  document.querySelectorAll("#w-hist-btns .btn").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll("#w-hist-btns .btn").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      st.histDays = Number(b.dataset.days) || 30;
      renderHistory();
    };
  });

  /* ---- estimated realized PnL (FIFO over recent token transfers) ---- */
  async function renderPnl() {
    const el = $("#w-pnl"); if (!el) return;
    try {
      const d = await getWallet(`/${addr}/pnl`);
      if (!alive()) return;
      const rows = (d.rows || []).filter((r) => r.transfers_priced > 0 || r.transfers_unpriced > 0);
      el.innerHTML = `
        <div style="padding:14px 16px">
          <div class="wallet-hero" style="padding:0">
            <div><div class="k">Estimated Realized PnL (90d window)</div><div class="v" style="color:${d.realized_pnl_usd >= 0 ? "var(--green)" : "var(--red)"}">${d.realized_pnl_usd >= 0 ? "+" : ""}${usd(d.realized_pnl_usd)}</div></div>
            <div><div class="k">Proceeds</div><div class="v">${usd(d.proceeds_usd)}</div></div>
            <div><div class="k">Cost Basis (FIFO)</div><div class="v">${usd(d.cost_usd)}</div></div>
          </div>
          <p class="muted" style="font-size:12.5px">${esc(d.method || "")}</p>
          <p class="muted" style="font-size:12.5px">Coverage: ${num(d.transfers_priced)} transfer(s) priced, ${num(d.transfers_unpriced)} unpriced (no CoinGecko history — excluded), ${num(d.transfers_unmatched)} outgoing with no cost basis in the window (excluded).${d.transfers_priced === 0 ? " No priced transfers in this window, so no realized PnL can be estimated — common for wallets whose recent transfers are unlisted/spam tokens." : ""}</p>
          ${rows.length ? `<table class="tbl"><thead><tr><th>Token</th><th>Chain</th><th class="r">Proceeds</th><th class="r">Cost</th><th class="r">Realized PnL</th><th class="r">Priced / Unpriced / Unmatched</th></tr></thead><tbody>
            ${rows.map((r) => `<tr><td>${linkTokenC(r.chain, r.token_address, r.token_symbol || shortH(r.token_address))} <span class="muted">${esc(r.token_name || "")}</span></td><td>${chainBadge(r.chain)}</td><td class="r mono">${usd(r.proceeds_usd)}</td><td class="r mono">${usd(r.cost_usd)}</td><td class="r mono" style="color:${r.realized_pnl_usd >= 0 ? "var(--green)" : "var(--red)"}">${r.realized_pnl_usd >= 0 ? "+" : ""}${usd(r.realized_pnl_usd)}</td><td class="r mono">${r.transfers_priced} / ${r.transfers_unpriced} / ${r.transfers_unmatched}</td></tr>`).join("")}</tbody></table>` : ""}
        </div>`;
    } catch (e) {
      if (!alive()) return;
      el.innerHTML = `<div class="empty">PnL unavailable: ${esc(e.message)}</div>`;
    }
  }

  /* ---- NFT gallery ---- */
  async function renderNfts() {
    const el = $("#w-nfts"); if (!el) return;
    try {
      const d = await getWallet(`/${addr}/nfts`);
      if (!alive()) return;
      const cnt = $("#w-nft-count"); if (cnt) cnt.textContent = num(d.count) + " shown";
      if (!d.items || !d.items.length) { el.innerHTML = `<div class="empty">No NFTs on any chain.</div>`; return; }
      el.innerHTML = `<div class="nftgrid">${d.items.map((n) => {
        const img = ipfsHttp(n.image_url || n.media_url);
        return `<a class="nft-card" data-chain="${esc(n.chain)}" href="#/token/${esc(n.token_address)}/instance/${esc(String(n.token_id))}">
          ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div style="aspect-ratio:1;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:var(--muted)">No image</div>`}
          <div class="nft-id">${esc(n.name || n.token_name || "NFT")} ${chainBadge(n.chain)}</div>
          <div class="nft-sub">${esc(n.token_name || n.token_symbol || "")} · #${esc(String(n.token_id))} · ${esc(n.token_type || "")}</div>
        </a>`;
      }).join("")}</div>
      <div class="muted" style="padding:0 16px 14px;font-size:12px">${esc(d.note || "")} Per chain: ${Object.entries(d.per_chain || {}).map(([c, n]) => `${esc(c)} ${n}`).join(" · ")}.${Object.keys(d.errors || {}).length ? " Errors: " + esc(Object.entries(d.errors).map(([c, e]) => c + ": " + e).join("; ")) : ""}</div>`;
    } catch (e) {
      if (!alive()) return;
      el.innerHTML = `<div class="empty">NFTs unavailable: ${esc(e.message)}</div>`;
    }
  }

  /* ---- unified activity feed (merged, time-sorted, Load-more/chain) ---- */
  function activityRow(t) {
    return `<tr><td>${linkTxC(t.chain, t.hash)}</td><td>${chainBadge(t.chain)}</td><td class="muted" style="white-space:nowrap">${esc(t.age || "")}</td><td>${linkAddrC(t.chain, t.from)}</td><td>${linkAddrC(t.chain, t.to)}</td><td class="r mono">${ethFmt(t.value_eth)}&nbsp;${esc(chainNativeSym(t.chain))}</td></tr>`;
  }
  async function renderActivity() {
    const el = $("#w-activity"); if (!el) return;
    try {
      const d = await getWallet(`/${addr}/activity`);
      if (!alive()) return;
      st.activityCursors = d.next_page_params || {};
      st.activityRows = d.items || [];
      el.innerHTML = `
        <table class="tbl"><thead><tr><th>Txn Hash</th><th>Chain</th><th>Age</th><th>From</th><th>To</th><th class="r">Value</th></tr></thead><tbody id="w-act-body"></tbody></table>
        <button class="loadmore" id="w-act-more">Load more</button>
        ${Object.keys(d.errors || {}).length ? `<div class="muted" style="padding:10px 16px;font-size:12px">Errors: ${esc(Object.entries(d.errors).map(([c, e]) => c + ": " + e).join("; "))}</div>` : ""}`;
      const body = $("#w-act-body");
      body.innerHTML = st.activityRows.length ? st.activityRows.map(activityRow).join("") : `<tr><td colspan="6"><div class="empty">No EVM transactions — Solana activity is not wired into this feed yet.</div></td></tr>`;
      wireActivityMore();
    } catch (e) {
      if (!alive()) return;
      el.innerHTML = `<div class="empty">Activity unavailable: ${esc(e.message)}</div>`;
    }
  }
  function wireActivityMore() {
    const btn = $("#w-act-more"); if (!btn) return;
    const hasCursor = () => Object.values(st.activityCursors).some((c) => c);
    btn.style.display = hasCursor() ? "" : "none";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Loading…";
      const chains = Object.keys(st.activityCursors).filter((c) => st.activityCursors[c]);
      const results = await Promise.all(chains.map(async (c) => {
        const q = new URLSearchParams({ chain: c, ...st.activityCursors[c] }).toString();
        try { return await getWallet(`/${addr}/activity?${q}`); }
        catch (e) { return { chain: c, items: [], next_page_params: null }; }
      }));
      if (!alive()) return;
      const fresh = [];
      for (const r of results) {
        st.activityCursors[r.chain] = r.next_page_params || null;
        fresh.push(...(r.items || []));
      }
      fresh.sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
      st.activityRows.push(...fresh);
      const body = $("#w-act-body");
      if (body && fresh.length) body.insertAdjacentHTML("beforeend", fresh.map(activityRow).join(""));
      btn.disabled = false; btn.textContent = "Load more";
      btn.style.display = hasCursor() ? "" : "none";
    };
  }

  // Aggregate first (hero + chains), then token holdings per chain in
  // parallel — the hero/totals recompute as each chain's holdings land.
  // History, PnL, NFTs and activity load independently.
  try { st.agg = await getWallet("/" + addr); } catch (e) { st.agg = null; }
  if (!alive()) return;
  renderHero(); renderChains();
  WALLET_CHAINS.forEach((c) => {
    getWallet(`/${addr}/tokens?chain=${c}`).then((sec) => {
      if (!alive()) return;
      st.tokens[c] = sec; st.tokensDone++;
      renderHero(); renderChains(); renderHoldings();
    }).catch((e) => {
      if (!alive()) return;
      st.tokens[c] = { chain: c, tokens: [], tokens_total_usd: null, tokens_count: null, tokens_priced_count: null, nft_count: null, error: e.message };
      st.tokensDone++;
      renderHero(); renderChains(); renderHoldings();
    });
  });
  renderHistory();
  renderPnl();
  renderNfts();
  renderActivity();
}

/* ---------------- router ---------------- */
/* Scope apps redirect wallet routes to walletscope; walletscope only
   serves the wallet dashboard + API docs. */
const routes = WALLET_ONLY ? [
  [/^#\/?$/, () => walletLanding()],
  [/^#\/api-docs$/, () => apiDocsPage()],
  [/^#\/wallet$/, () => walletLanding()],
  [/^#\/wallet\/(.+)$/, (m) => walletPage(decodeURIComponent(m[1]))],
] : [
  [/^#\/?$/, () => home()],
  [/^#\/charts$/, () => chartsPage()],
  [/^#\/gastracker$/, () => gasPage()],
  [/^#\/pending$/, () => pendingPage()],
  [/^#\/api-docs$/, () => apiDocsPage()],
  [/^#\/wallet$/, () => { window.location.href = WALLET_URL + "/#/wallet"; }],
  [/^#\/wallet\/(.+)$/, (m) => { window.location.href = WALLET_URL + "/#/wallet/" + encodeURIComponent(decodeURIComponent(m[1])); }],
  [/^#\/block\/([^/]+)$/, (m) => blockPage(m[1])],
  [/^#\/tx\/(0x[0-9a-fA-F]{64})$/, (m) => txPage(m[1])],
  [/^#\/address\/(0x[0-9a-fA-F]{40})$/, (m) => addressPage(m[1])],
  [/^#\/token\/(0x[0-9a-fA-F]{40})\/instance\/([^/]+)$/, (m) => tokenInstancePage(m[1], decodeURIComponent(m[2]))],
  [/^#\/token\/(0x[0-9a-fA-F]{40})$/, (m) => tokenPage(m[1])],
  [/^#\/contract\/(0x[0-9a-fA-F]{40})$/, (m) => contractPage(m[1])],
];
function route() {
  banner(null);
  clearPoll();
  const h = location.hash || "#/";
  for (const [re, fn] of routes) {
    const m = h.match(re);
    if (m) { fn(m); return; }
  }
  document.title = "Not found — " + TITLE;
  render(`<div class="card" style="margin-top:22px"><div class="empty">Page not found: <span class="mono">${esc(h)}</span><br><a href="#/">Back to home</a></div></div>`);
}

document.addEventListener("DOMContentLoaded", async () => {
  // Per-app branding + navigation from /config.js.
  document.title = TITLE + (WALLET_ONLY ? " — Cross-Chain Wallet" : " — Block Explorer");
  const badge = document.getElementById("brand-badge");
  if (badge) badge.textContent = CFG.brandLetter || "E";
  const bname = document.getElementById("brand-name");
  if (bname) { const _bm = TITLE.match(/^(.*)(scope)$/i); bname.innerHTML = _bm ? esc(_bm[1]) + '<span class="brand-accent">' + esc(_bm[2]) + '</span>' : esc(TITLE) + '<span class="brand-accent">Scope</span>'; }
  const fbrand = document.getElementById("footer-brand");
  if (fbrand) fbrand.textContent = TITLE;
  const fav = document.querySelector('link[rel="icon"]');
  if (fav && CFG.brandLetter) {
    fav.href = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230784c3'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>" + CFG.brandLetter + "</text></svg>");
  }
  // Scope switcher: jump between sibling Scope apps.
  const scopeSel = document.getElementById("scope-select");
  if (scopeSel) {
    scopeSel.innerHTML = `<option value="">${esc(TITLE)}</option>` + SIBLINGS.map((s) => `<option value="${esc(s.url)}">${esc(s.name)}</option>`).join("");
    scopeSel.onchange = () => { if (scopeSel.value) window.location.href = scopeSel.value; };
  }
  // Wallet links point at walletscope from explorer apps.
  const nw = document.getElementById("nav-wallet");
  if (nw && !WALLET_ONLY && WALLET_URL) nw.href = WALLET_URL + "/#/wallet";
  const fw = document.getElementById("footer-wallet");
  if (fw && !WALLET_ONLY && WALLET_URL) fw.href = WALLET_URL + "/#/wallet";
  if (WALLET_ONLY) {
    document.querySelectorAll(".nav-explorer").forEach((el) => { el.style.display = "none"; });
    const si = document.getElementById("search-input");
    if (si) si.placeholder = "Search by Address / ENS name";
  }
  wireSearch($("#search-form"), $("#search-input"), $("#search-suggest"));
  document.getElementById("view").addEventListener("click", (e) => {
    const b = e.target.closest("[data-copy]");
    if (b) {
      e.preventDefault();
      navigator.clipboard.writeText(b.dataset.copy).then(() => {
        const old = b.textContent; b.textContent = "✓";
        setTimeout(() => { b.textContent = old; }, 1200);
      });
    }
    // data-chain links no longer switch chains: in walletscope the
    // link*C helpers emit absolute URLs into the sibling Scope app, and
    // explorer apps have no wallet page, so no data-chain link can occur
    // here. Nothing to do — the href is followed as-is.
  });
  window.addEventListener("hashchange", route);
  await loadChains();
  await loadLabels();
  route();
});

</script>
</body>

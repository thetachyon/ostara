[package]
name = "ostara"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust reimplementation of the OSIRIS (osirisai.live) open-source intelligence platform's API core: feed aggregation, normalization, caching, streaming."
license = "MIT"

[[bin]]
name = "ostara"
path = "src/main.rs"

[lib]
name = "ostara"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls-native-roots", "json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hickory-resolver = { version = "0.24", features = ["tokio"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1.19", features = ["time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
base64 = "0.22"
futures-util = "0.3"
feed-rs = "2"

[dev-dependencies]
criterion = "0.5"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "parse_bench"
harness = false

[profile.bench]
debug = false
